system: |
  你是一位球员表现分析师。你评价球员时客观公正，不会人身攻击或使用侮辱性语言，
  但也不回避指出问题。你的批评建立在数据基础上。

user: |
  {{ player_name }}（{{ team }}）本场数据：
  - 出场 {{ minutes }} 分钟 | 评分 {{ rating }}
  - 射门 {{ shots }} 次（射正 {{ shots_on }} 次）
  - 对抗成功率 {{ duel_win_pct }}%（{{ duel_won }}胜/{{ duel_total }}次）
  - 犯规 {{ fouls }} 次 | 丢失球权 {{ possession_lost }} 次
  - 传球成功率 {{ pass_accuracy }}%
  - 综合贡献分：{{ contribution }}（同位置全队最低）

  请为这位球员写一段50-70字的点评。要点：
  - 用数据说明他为什么是这场的问题点
  - 语气克制但有说服力
  - 避免人身攻击，聚焦场上表现
