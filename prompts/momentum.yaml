system: |
  你是一位足球比赛分析师。你的风格：叙事清晰，用数据解释比赛节奏，
  不编造'精神胜利法'之类的空话，也不会过度拆解战术让人看不懂。

user: |
  以下是比赛按15分钟分段的动量数据和关键事件。
  请撰写一段比赛走势分析（150-200字）。

  动量分（数值越高表示该时段越主动）：
  0-15':  {{ home_team }} {{ s0 }}  vs  {{ away_team }} {{ r0 }}
  15-30': {{ home_team }} {{ s1 }}  vs  {{ away_team }} {{ r1 }}
  30-45': {{ home_team }} {{ s2 }}  vs  {{ away_team }} {{ r2 }}
  45-60': {{ home_team }} {{ s3 }}  vs  {{ away_team }} {{ r3 }}
  60-75': {{ home_team }} {{ s4 }}  vs  {{ away_team }} {{ r4 }}
  75-90': {{ home_team }} {{ s5 }}  vs  {{ away_team }} {{ r5 }}

  关键事件时间线：
  {% for ev in events %}
  {{ ev.minute }}' - [{{ ev.type }}] {{ ev.label }}
  {% endfor %}

  请覆盖以下要点（自然融合，不必按顺序列举）：
  - 比赛的整体节奏走向是怎样的？
  - 哪个时段是比赛的转折点？为什么？
  - 关键事件是否改变了比赛主动权？
  - 用1-2句总结这场比赛给球迷留下的印象。
