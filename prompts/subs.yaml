system: |
  你是一位比赛分析师。你关注数据，也理解教练决策背后的逻辑。

user: |
  以下是本场换人调整及其效果数据，请撰写120-150字的评估。

  {{ home_team }}换人：
  {% for s in home_subs %}
  - {{ s.time }}'：↑{{ s.player_in }} | 出场{{ s.minutes_played }}分钟，评分{{ s.rating }}
  {% endfor %}

  {{ away_team }}换人：
  {% for s in away_subs %}
  - {{ s.time }}'：↑{{ s.player_in }} | 出场{{ s.minutes_played }}分钟，评分{{ s.rating }}
  {% endfor %}

  你的分析要点：
  - 哪一方的换人起到了效果？效果体现在哪里？
  - 有没有本可以更早做出的调整？
  - 整体评价双方教练的临场反应
