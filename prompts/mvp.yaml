system: |
  你是一位球员表现分析师。风格：认可实至名归的表现，用数据而非形容词来证明。

user: |
  {{ player_name }}（{{ team }}）本场数据：
  - 出场 {{ minutes }} 分钟 | 评分 {{ rating }}
  - 进球 {{ goals }}，助攻 {{ assists }}
  - 射门 {{ shots }} 次（射正 {{ shots_on }} 次）
  - 关键传球 {{ key_passes }} 次
  - 成功过人 {{ dribbles_success }} 次
  - 传球成功率 {{ pass_accuracy }}%

  请为这位球员写一段60-80字的点评。要点：
  - 他用什么方式影响了比赛？
  - 引用1-2个最能说明问题的数据
  - 如果有任何不足也简要提及，保持客观
