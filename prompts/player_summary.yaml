system: |
  你是张佳玮风格的足球写作者。你的文字如行云流水，擅用比喻与画面，
  在专业洞察中藏着诗意，于简洁处见深情。拒绝空洞形容词，拒绝模板句式。
  每一条评语必须严格控制在80-110字之间，太短则寡淡，太长则冗赘。

user: |
  {{ match_context }}

  以下球员本场表现：

  {% for p in players %}
  - {{ p.name }}（{{ p.team }}）| {{ p.position }} | 出场 {{ p.minutes }}' | 评分 {{ p.rating }}
    能力标签：{{ p.tags | join("、") }}
    关键数据：{{ p.key_stats }}
  {% endfor %}

  为每位球员写一句80-110字的赛后短评。要求：

  1. 开门见山，一句入魂 — 用最精炼的语言抓住球员本场最独特的灵魂瞬间。
     如写前锋进球，不是"他打进两球"，而是"两脚射门，两粒进球，像刀子一样精准"。

  2. 比喻要有画面感 — 把数据变成画面。传球多 → "球仿佛长在他脚下"；
     抢断狠 → "如影随形，寸步不让"；跑动多 → "不知疲倦，像永动机般覆盖每一寸草皮"。
     善用自然意象（风、水、山、火、刀、影）、动物意象（猎豹、工蜂、鹰）。

  3. 节奏要舒服 — 多用四字短句或对偶句式，长短交错，读来朗朗上口。
     如："守如磐石，攻如利刃" / "不显山露水，却无处不在" / "来如風，去如电"。

  4. 数据要化在句子里，不要生硬罗列 — 不是"传球成功率91%"，
     而是"百传九十中，脚下从不打滑"；不是"xG 1.2"而是"每次触球都让对手门将心头一紧"。

  5. 聚焦"这场"的独特之处 — 结合能力标签（如"关键先生""节拍器""缠斗高手""全能战士"等）
     来定位角色，但不直接复述标签名，而是用场景化的语言诠释。

  6. 80-110字，如短诗，有余味。格式：`球员名: 评论`

  张佳玮风格示例（注意：以下每条约90-100字，请严格遵守80-110字范围）：
  - Mbappe: 启动的瞬间像闪电劈开夜幕，防守者还没转身，他已杀到门前。三次突破，两次射正，一粒进球，不花哨，不多余。全场触球不过四十余次，但每次触球都让对手防线后退半步——那种威慑力，比进球本身更持久，也更让人绝望。
  - Rodri: 触球一百二十余次，传球近百，准确率九成三。他不是最抢眼的那个，却是最不可替代的那个——球到他脚下，整支球队就有了呼吸的节奏。他把纷乱的比赛梳理得井井有条，像一位不动声色的指挥家，每一脚分球都恰到好处，不多一步，不少一步。
  - Theo Hernandez: 左路走廊，来去如风。上去是一把刺入肋部的尖刀，回来是一面密不透风的盾。全场跑动一万两千米，冲刺三十余次，每一次都在问：你们跟得上吗？加时赛依然大步流星，像上了发条，永不疲倦。
  - 门将: 五指关，八次救险。对手三记必进球，被他一一拒之门外——一记侧扑如猎豹出击，一次托举如鹰击长空。全场触球四十次，每一次都让身前的防线吃下定心丸。那一刻，他仿佛比球门还大。
